name: Build Void Store APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            cmdline-tools;latest

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project archive
        run: |
          if [ ! -f "VoidStore_Project.zip" ]; then
            echo "Missing VoidStore_Project.zip in repo root"
            exit 1
          fi
          unzip -o VoidStore_Project.zip
          ls -la
          if [ ! -d "VoidStore/android" ]; then
            echo "Expected Android project at VoidStore/android"
            exit 1
          fi

      - name: Build release APK
        working-directory: VoidStore/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean :app:assembleRelease

      - name: Check APK output
        run: |
          find VoidStore/android -path "*build/outputs/apk/*/*.apk" -type f

      - name: Rename APK
        run: |
          if [ -f "VoidStore/android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp "VoidStore/android/app/build/outputs/apk/release/app-release.apk" "VoidStore.apk"
          elif [ -f "VoidStore/android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp "VoidStore/android/app/build/outputs/apk/debug/app-debug.apk" "VoidStore.apk"
          else
            echo "APK not found"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoidStore-APK
          path: VoidStore.apk
          if-no-files-found: error
